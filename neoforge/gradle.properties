org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=false

## Environment
# NeoForge 1.20.1 (47.1.x) 是从 Forge 47.x fork 出来的，包名和注册的 mod id 都没有变，
# 所以这个模块直接使用 Forge 47.4.x 的 userdev 工具链构建，产物可以直接装到 NeoForge 1.20.1。
# 详见 ../docs/NEOFORGE-1.20.1.md
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.20.2)
forge_version=47.4.23
forge_version_range=[47,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

## Mod
mod_id=firstlight
mod_name=FirstLight
mod_license=MIT
mod_version=1.0.0
mod_group_id=com.syuto.introvideo
mod_authors=redwine
mod_description=Replaces the Minecraft startup loading screen with a full-screen video intro, then waits for any key press before showing the main menu.

